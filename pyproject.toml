[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubepilot"
version = "0.1.0"
description = "KubePilot — EKS decision intelligence (Phase 1 read-only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "arq>=0.26.0",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "kubernetes>=31.0.0",
  "authlib>=1.4.0",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "openapi-spec-validator>=0.7.0",
  "PyYAML>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kubepilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
